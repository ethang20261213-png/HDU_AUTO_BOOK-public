name: HDU Auto Book TEST

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test Book (pure HTTP login, tomorrow 7:00-8:00 single desks)
        env:
          SCHOOL_ID: ${{ secrets.SCHOOL_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SCKEY: ${{ secrets.SCKEY }}
          BOOK_DAYS_AHEAD: "1"
          USER_CONFIG: test_config.yml
        run: python main.py
